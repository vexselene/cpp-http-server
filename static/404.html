<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf0e6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .icon {
            max-width: 130px;
            width: 100%;
        }

        .text-block {
            text-align: left;
        }

        .status {
            font-size: 4rem;
            font-weight: 500;
            color: #b87a5a;
            letter-spacing: -2px;
            line-height: 1;
        }

        .message {
            font-size: 1.1rem;
            color: #9a7b64;
            font-weight: 350;
            margin-top: 0.3rem;
        }

        .sub {
            font-size: 0.75rem;
            color: #c9aa8e;
            margin-top: 0.6rem;
        }
    </style>
</head>

    <div class="container">
